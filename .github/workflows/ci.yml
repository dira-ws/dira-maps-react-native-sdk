# Intégration continue du SDK : ce qui doit être vert avant de fusionner.
#
# Deux jobs indépendants. Le SDK n'a aucune dépendance à l'exécution ni
# module natif : ses tests sont du TypeScript pur et tournent sans appareil.
# L'exemple est compilé (types) et son banc d'essai lancé HORS LIGNE — les
# vérifications pures seulement : la CI ne doit pas dépendre de
# maps.dira.llc, et un déploiement cassé n'est pas une régression du SDK.
name: CI

# ⚠️ PLUS SUR `push` VERS `main` — décidé le 18 octobre 2026.
#
# Après une fusion, la poussée sur `main` rejouait à l'identique ce qui venait
# de passer sur la PR : même arbre, même verdict. Sur 30 jours, la plateforme
# comptait 884 exécutions déclenchées par `push` pour 604 par PR.
#
# ⚠️ MAIS LA PR GARDE SON ÉPREUVE ICI, ET POUR UNE RAISON PRÉCISE : ce dépôt est
# PUBLIC, ses minutes d'exécution sont gratuites. Ailleurs sur la plateforme les
# épreuves ont été ramenées en local parce qu'elles coûtaient ; là où elles ne
# coûtent rien, les retirer ne ferait que perdre une vérification.
on:
  pull_request:
  workflow_dispatch:

# Une exécution par référence : la suivante annule la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  example:
    name: Exemple (typecheck + banc d'essai hors ligne)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `file:..` : l'exemple consomme le SDK compilé depuis ce dépôt, comme
      # une application le ferait depuis le paquet.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: example
      - run: npm run typecheck
        working-directory: example
      - run: npm run check:offline
        working-directory: example
